<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prediction Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141922">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#090d13; --panel:#151d29; --panel2:#0b1119; --border:#1f2836; --line:#26303f;
  --text:#e6ebf2; --muted:#8b97ab; --accent:#f5b942;
  --green:#2ecc71; --red:#e74c5b; --blue:#4aa3ff; --purple:#a78bfa;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'SF Mono',Consolas,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh}
header{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:50;flex-wrap:wrap}
header h1{font-size:17px;letter-spacing:.5px}
header h1 span{color:var(--accent)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:1px solid transparent;color:var(--muted);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
nav button:hover{color:var(--text)}
nav button.active{background:#1b2432;color:var(--text);border-color:transparent}
#subnav{display:flex;gap:4px;padding:8px 22px;background:#0d131d;border-bottom:1px solid var(--border)}
#subnav:empty{display:none}
#subnav button{background:none;border:none;color:var(--muted);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
#subnav button.active{background:#1b2432;color:var(--text)}
#subnav button:hover{color:var(--text)}
main{padding:22px;max-width:1280px;margin:0 auto}
.grid{display:grid;gap:14px}
.cards{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--panel);border:none;border-left:3px solid var(--blue);border-radius:0 10px 10px 0;padding:12px 14px}
.card:nth-child(4n+1){border-left-color:var(--green)}
.card:nth-child(4n+2){border-left-color:var(--blue)}
.card:nth-child(4n+3){border-left-color:var(--accent)}
.card:nth-child(4n+4){border-left-color:var(--purple)}
.card .k{font-size:11px;letter-spacing:.06em;color:#5d6879;margin-bottom:3px}
.card .v{font-size:24px;font-weight:500;font-family:var(--mono);line-height:1.25}
.card .s{font-size:12px;color:#5d6879;margin-top:2px}
.panel{background:var(--panel);border:none;border-radius:10px;padding:16px;margin-top:12px}
.panel h2{font-size:13.5px;font-weight:500;letter-spacing:0;color:var(--text);margin-bottom:10px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.05em;color:#5d6879;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tr.rowbtn{cursor:pointer}
tr.rowbtn:hover td{background:#1b2432}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.4px}
.tag.hit{background:rgba(46,204,113,.15);color:var(--green)}
.tag.miss{background:rgba(231,76,91,.15);color:var(--red)}
.tag.avoid{background:rgba(167,139,250,.15);color:var(--purple)}
.tag.pend{background:rgba(74,163,255,.14);color:var(--blue)}
.tag.watch{background:rgba(245,185,66,.15);color:var(--accent)}
.stars{color:var(--accent);letter-spacing:1px;white-space:nowrap}
.num{font-family:var(--mono)}
.pos{color:var(--green)}.neg{color:var(--red)}
.muted{color:var(--muted)}
button.btn{background:var(--text);color:#0b0f16;border:none;padding:7px 14px;border-radius:7px;font-weight:500;cursor:pointer;font-size:13px}
button.btn:hover{background:#fff}
button.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:400}
button.btn.ghost:hover{border-color:#4a5769}
button.btn.sm{padding:4px 10px;font-size:12px}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:7px 10px;font-size:13px;font-family:var(--font)}
textarea{width:100%;font-family:var(--mono);font-size:12px}
input:focus,select:focus,textarea:focus{outline:1px solid var(--accent)}
.formrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:flex-end}
.formrow label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.detail{background:#101825;border-radius:9px;padding:13px;margin:6px 0}
.layers{display:flex;gap:0;flex-wrap:wrap;align-items:center;font-family:var(--mono);font-size:13px;margin:8px 0}
.layers .step{background:#0b1119;border:1px solid var(--border);border-radius:8px;padding:8px 12px;text-align:center;min-width:86px}
.layers .step .lk{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.7px}
.layers .step .lv{font-size:15px;font-weight:700;margin-top:2px}
.layers .arr{padding:0 8px;color:var(--muted)}
.layers .final{border-color:var(--accent)}
.layers .final .lv{color:var(--accent)}
#toast{position:fixed;bottom:22px;right:22px;background:#1b2432;border:1px solid var(--line);color:var(--text);padding:12px 18px;border-radius:10px;display:none;z-index:99;max-width:420px}
.bar{height:8px;background:#0b1119;border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--green)}
details.rule{border-bottom:1px solid var(--border);padding:8px 4px}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.calcout{background:var(--panel);border:none;border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:18px;margin-top:14px;text-align:center}
.calcout .big{font-size:38px;font-weight:800;font-family:var(--mono);color:var(--accent)}
.small{font-size:12px}
@media(max-width:700px){main{padding:12px}.layers .step{min-width:70px}}
</style>
</head>
<body>
<header>
  <h1>⚽ PREDICTION <span>HUB</span></h1>
  <nav id="nav"></nav>
  <label class="right small muted" style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="expertchk" style="width:14px;height:14px" onchange="setExpert(this.checked)"> expert</label>
  <div class="small muted" id="syncstate">connecting…</div>
</header>
<div id="subnav"></div>
<main id="main">Loading…</main>
<div id="toast"></div>

<script>
const SB_URL = "https://fcuasuedmjrllqktkhql.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjdWFzdWVkbWpybGxxa3RraHFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyODQ5NDgsImV4cCI6MjA5ODg2MDk0OH0.8XtNieLQuFKnCmcTSp7P1RC5VNA84VNhck4JOKqhlsg";

const H = {apikey:SB_KEY, Authorization:"Bearer "+SB_KEY, "Content-Type":"application/json"};
async function api(path, opts={}){
  const r = await fetch(SB_URL+"/rest/v1/"+path, {headers:{...H, ...(opts.headers||{})}, method:opts.method||"GET", body:opts.body?JSON.stringify(opts.body):undefined});
  if(!r.ok){ const t=await r.text(); throw new Error(r.status+" "+t); }
  const t=await r.text();
  if(!t) return null;
  try{ return JSON.parse(t); }catch(_){ return null; }
}

let EXPERT = localStorage.getItem("expert")==="1";
let PAPERS=null;
function setExpert(v){EXPERT=!!v;localStorage.setItem("expert",v?"1":"0");render();}
let DB = {predictions:[], players:[], coaches:[], teams:[], venues:[], news:[], settings:{}, plf:[], plt:[], plstate:null};
let TAB = location.hash.replace("#","") || "dashboard";

async function loadAll(){
  document.getElementById("syncstate").textContent="syncing…";
  const [p,pl,co,te,ve,ne,se,plf,plt,au,lg] = await Promise.all([
    api("predictions?select=*&order=match_date.desc.nullslast,entry_no.desc"),
    api("players?select=*&order=team.asc,prs.desc"),
    api("coaches?select=*&order=team.asc"),
    api("teams?select=*&order=name.asc"),
    api("venues?select=*&order=altitude_m.desc"),
    api("news_items?select=*&order=item_date.desc,id.desc"),
    api("settings?select=*"),
    api("pl_fixtures?select=*&order=kickoff.asc.nullslast"),
    api("pl_teams?select=*&order=name.asc"),
    api("autopsies?select=*&order=id.asc"),
    api("bets_ledger?select=*&order=placed_at.desc")
  ]);
  DB={predictions:p, players:pl, coaches:co, teams:te, venues:ve, news:ne, settings:Object.fromEntries(se.map(s=>[s.key,s.value])), plf:plf, plt:plt, autopsies:au, ledger:lg};
  DB.plstate = DB.settings.pl_state || null;
  document.getElementById("syncstate").textContent="✓ synced "+new Date().toLocaleTimeString();
  render();
}
async function syncPL(silent=true){
  try{
    const r = await fetch(SB_URL+"/functions/v1/sync-pl");
    const d = await r.json();
    if(d.ok){ const formOpen = showAddPred||showAddNews||showAddPlayer||showAddCoach||showAddVenue; if(!formOpen) await loadAll(); if(!silent) toast("PL data refreshed — "+d.fixtures+" fixtures"); }
  }catch(e){ if(!silent) toast("PL sync failed: "+e.message,false); }
}
function toast(m,ok=true){const t=document.getElementById("toast");t.textContent=m;t.style.borderColor=ok?"var(--green)":"var(--red)";t.style.display="block";setTimeout(()=>t.style.display="none",3500);}
const esc = s => (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const starstr = n => n?("⭐".repeat(Math.min(n,6))):"—";
const fmtadj = v => v==null||v===0?'<span class="muted">—</span>':`<span class="${v>0?'pos':'neg'} num">${v>0?'+':''}${v}%</span>`;
const outcomeTag = o => !o?'<span class="tag pend">PENDING</span>':o==="HIT"?'<span class="tag hit">✅ HIT</span>':o==="MISS"?'<span class="tag miss">❌ MISS</span>':o==="UNRESOLVED"?'<span class="tag pend" style="opacity:.6">UNRESOLVED</span>':o.startsWith("AVOID")?`<span class="tag avoid">${o==="AVOID_CORRECT"?"✅":"❌"} ${o.replace("_"," ")}</span>`:esc(o);

/* ---------- NAV ---------- */
const GROUPS = [
  {id:"dashboard", label:"Dashboard", tabs:[["dashboard","Dashboard"]]},
  {id:"news",      label:"News",      tabs:[["news","Live feed & notes"]]},
  {id:"preds",     label:"Predictions", tabs:[["engine","Engine Picks"],["bankroll","Bankroll"]]},
  {id:"league",    label:"League",    tabs:[["pltable","Table & Team Profiles"],["fixtures","Matchweek detail"],["inplay","In-Play Card"],["venues","Venues (AIS)"]]},
  {id:"squads",    label:"Scouting Report", tabs:[["scout","Pitch view"],["scouttext","Club notes"],["players","Players (PRS)"],["coaches","Coaches (TMS)"]]},
  {id:"tools",     label:"Tools",     tabs:[["calculator","Calculator"],["data","Import / Export"],["predictions","Legacy archive"],["autopsies","Legacy autopsies"]]},
];
const LASTTAB={};
const groupOf = t => GROUPS.find(g=>g.tabs.some(([k])=>k===t)) || GROUPS[0];
function renderNav(){
  const g=groupOf(TAB);
  document.getElementById("nav").innerHTML = GROUPS.map(gr=>`<button class="${gr.id===g.id?'active':''}" onclick="goGroup('${gr.id}')">${gr.label}</button>`).join("");
  document.getElementById("subnav").innerHTML = g.tabs.length>1 ? g.tabs.map(([k,l])=>`<button class="${TAB===k?'active':''}" onclick="go('${k}')">${l}</button>`).join("") : "";
}
function goGroup(id){
  const g=GROUPS.find(x=>x.id===id);
  go(LASTTAB[id]||g.tabs[0][0]);
}
let SCROLLTOP=false;
function go(t){TAB=t;LASTTAB[groupOf(t).id]=t;location.hash=t;SCROLLTOP=true;render();}

function render(){
  var _ry=window.scrollY||0;
  renderNav();
  const ec=document.getElementById("expertchk"); if(ec)ec.checked=EXPERT;
  const m=document.getElementById("main");
  if(TAB==="dashboard") m.innerHTML=vDashboard();
  else if(TAB==="predictions") m.innerHTML=vPredictions();
  else if(TAB==="fixtures") m.innerHTML=vFixtures();
  else if(TAB==="news") m.innerHTML=vNews();
  else if(TAB==="match") m.innerHTML=vMatch();
  else if(TAB==="bankroll") m.innerHTML=vBankroll();
  else if(TAB==="pltable"){renderPLTable();return;}
  else if(TAB==="autopsies"){renderAutopsies();return;}
  else if(TAB==="ledger") m.innerHTML=vLedger();
  else if(TAB==="engine"){ if(PAPERS&&PAPERS.length){document.getElementById("main").innerHTML=vEngine();} else renderEngine(); return;}
  else if(TAB==="inplay"){renderInplay();return;}
  else if(TAB==="scout") m.innerHTML=vPitch();
  else if(TAB==="scouttext") m.innerHTML=vScout();
  else if(TAB==="players") m.innerHTML=vPlayers();
  else if(TAB==="coaches") m.innerHTML=vCoaches();
  else if(TAB==="venues") m.innerHTML=vVenues();
  else if(TAB==="calculator") m.innerHTML=vCalc();
  else if(TAB==="data") m.innerHTML=vData();
  if(SCROLLTOP){ window.scrollTo(0,0); SCROLLTOP=false; } else { window.scrollTo(0,_ry); }
}

/* ---------- PL HELPERS ---------- */
const getFx = id => DB.plf.find(f=>f.id===id);
const fxLabel = f => `${f.team_h_name} vs ${f.team_a_name}`;
const fxScore = f => f.team_h_score==null?"":`${f.team_h_score}-${f.team_a_score}`;
const fxWinner = f => !f.finished?null:(f.team_h_score>f.team_a_score?f.team_h_name:f.team_a_score>f.team_h_score?f.team_a_name:"Draw");
const fxResultStr = f => `${f.team_h_name} ${f.team_h_score}-${f.team_a_score} ${f.team_a_name}`;
function seasonNotStarted(s){ return s && !s.season_over && (s.current_gw==null); }
const ABBR={"Arsenal":"ARS","Aston Villa":"AVL","Bournemouth":"BOU","Brentford":"BRE","Brighton":"BHA","Chelsea":"CHE","Coventry City":"COV","Crystal Palace":"CRY","Everton":"EVE","Fulham":"FUL","Hull City":"HUL","Ipswich Town":"IPS","Leeds":"LEE","Liverpool":"LIV","Man City":"MCI","Man Utd":"MUN","Newcastle":"NEW","Nott'm Forest":"NFO","Spurs":"TOT","Sunderland":"SUN","West Ham":"WHU","Wolves":"WOL","Brighton & Hove Albion":"BHA","Tottenham":"TOT","Leeds United":"LEE"};
function abbr(n){ if(!n)return "";
  if(ABBR[n])return ABBR[n];
  const w=String(n).replace(/[^A-Za-z ]/g,"").trim().split(/\s+/);
  return (w.length>1?(w[0][0]+w[1][0]+(w[1][1]||w[0][1]||"")):w[0].slice(0,3)).toUpperCase();
}
let MWVIEW=null;
function mwNav(d){ const cur=(DB.plstate&&DB.plstate.current_gw)||1; if(MWVIEW==null)MWVIEW=cur; MWVIEW=Math.max(1,Math.min(38,MWVIEW+d)); render(); }
function mwReset(){ MWVIEW=null; render(); }
function fxDone(f){ return !!(f.finished||f.finished_provisional||(f.team_h_score!=null&&f.kickoff&&(Date.now()-new Date(f.kickoff).getTime())>9000000)); }
function fxLive(f){ return !!(f.started&&!fxDone(f)); }
function plBanner(){
  const s=DB.plstate;
  if(!s) return `<div class="panel" style="margin-top:0"><h2>Premier League</h2><p class="muted">No PL data yet — <button class="btn sm" onclick="syncPL(false)">Sync now</button></p></div>`;
  let numeral, label, sub;
  if(s.season_over){ numeral="38"; label="season complete"; sub=`all matchweeks played · ${esc(String(s.season))}`; }
  else if(seasonNotStarted(s)){ numeral="—"; label="season not started"; sub=s.first_kickoff?`first kickoff ${new Date(s.first_kickoff).toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"})}`:`season ${esc(String(s.season))}`; }
  else { numeral=String(s.current_gw).padStart(2,"0"); label="matchweek of 38"; sub=`season ${esc(String(s.season))}`; }
  const gw=(MWVIEW!=null?MWVIEW:s.current_gw);
  if(MWVIEW!=null&&MWVIEW!==s.current_gw){ numeral=String(MWVIEW).padStart(2,"0"); label=MWVIEW<s.current_gw?"matchweek — played":"matchweek — upcoming"; }
  const fx=(DB.plf||[]).filter(f=>(+f.event||0)===+gw&&f.team_h_name&&f.team_a_name)
    .sort((a,b)=>new Date(a.kickoff)-new Date(b.kickoff));
  const chip=f=>{
    const live=fxLive(f), done=fxDone(f);
    const kt=f.kickoff?new Date(f.kickoff):null;
    const day=kt?kt.toLocaleDateString([],{weekday:"short"}).toLowerCase():"";
    const tm=kt?kt.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hour12:false}):"";
    const head=live?`<span style="color:var(--red)">&#9679; live${f.minutes?" "+f.minutes+"'":""}</span>`
      :done?`<span style="color:#4d5766">${day} ${tm} · ft</span>`
      :`<span style="color:var(--blue)">${day} ${tm}</span>`;
    const body=f.team_h_score==null
      ? `${abbr(f.team_h_name)} <span style="color:#4d5766">v</span> ${abbr(f.team_a_name)}`
      : `${abbr(f.team_h_name)} <b style="color:var(--text)">${f.team_h_score}</b> &#8212; <b style="color:var(--text)">${f.team_a_score}</b> ${abbr(f.team_a_name)}`;
    return `<div style="background:#0b1119;border:1px solid #1f2836;border-radius:10px;padding:8px 11px;min-width:0;cursor:pointer" onclick="openMatch(${f.id})">
      <div style="font-size:10.5px;letter-spacing:.05em;margin-bottom:3px;white-space:nowrap;overflow:hidden">${head}</div>
      <div style="font-size:13px;color:${f.team_h_score==null?"var(--muted)":"#c3ccda"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${body}</div></div>`;
  };
  const shown=fx.slice(0,11), rest=fx.length-shown.length;
  return `<div class="panel" style="margin-top:0;padding:14px 16px">
    <div class="flex" style="align-items:center">
      <div class="flex" style="gap:8px;align-items:center">
        <button class="btn ghost sm" style="padding:3px 9px" onclick="mwNav(-1)">&#9664;</button>
        <span class="num" style="font-size:30px;font-weight:500;line-height:1">${numeral}</span>
        <button class="btn ghost sm" style="padding:3px 9px" onclick="mwNav(1)">&#9654;</button>
        ${MWVIEW!=null&&MWVIEW!==s.current_gw?`<button class="btn ghost sm" style="padding:3px 9px;color:var(--accent);border-color:var(--accent)" onclick="mwReset()">today</button>`:""}
        <span style="margin-left:2px"><span class="small" style="color:var(--text);display:block">${label}</span>
        <span style="font-size:11.5px;color:#4d5766">${sub}</span></span>
      </div>
      <div class="right small" style="text-align:right;color:#4d5766">synced ${s.last_sync?new Date(s.last_sync).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):"—"}
        <button class="btn ghost sm" onclick="syncPL(false)" style="margin-left:8px">&#8635;</button></div>
    </div>
    ${fx.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,185px));gap:7px;margin-top:11px">${shown.map(chip).join("")}
      ${rest>0?`<div style="background:#0b1119;border:1px solid #1f2836;border-radius:10px;padding:8px 11px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#4d5766">+${rest} more</div>`:""}</div>`:""}
  </div>`;
}
function plTable(){
  const done=DB.plf.filter(f=>f.finished&&f.team_h_name&&f.team_a_name);
  const t={};
  for(const tm of DB.plt) t[tm.name]={team:tm.name,p:0,w:0,d:0,l:0,gf:0,ga:0,cs:0,pts:0,form:[],hw:0,hd:0,hl:0,aw:0,ad:0,al:0};
  const byDate=[...done].sort((a,b)=>new Date(a.kickoff)-new Date(b.kickoff));
  for(const f of byDate){
    const h=t[f.team_h_name],a=t[f.team_a_name]; if(!h||!a)continue;
    h.p++;a.p++;h.gf+=f.team_h_score;h.ga+=f.team_a_score;a.gf+=f.team_a_score;a.ga+=f.team_h_score;
    if(f.team_a_score===0)h.cs++; if(f.team_h_score===0)a.cs++;
    if(f.team_h_score>f.team_a_score){h.w++;h.hw++;a.l++;a.al++;h.pts+=3;h.form.push("W");a.form.push("L");}
    else if(f.team_h_score<f.team_a_score){a.w++;a.aw++;h.l++;h.hl++;a.pts+=3;a.form.push("W");h.form.push("L");}
    else{h.d++;h.hd++;a.d++;a.ad++;h.pts++;a.pts++;h.form.push("D");a.form.push("D");}
  }
  return Object.values(t).sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf);
}
const formBadges = arr => arr.slice(-5).map(r=>`<span class="tag ${r==="W"?"hit":r==="L"?"miss":"pend"}" style="padding:1px 6px;margin-right:2px">${r}</span>`).join("");

/* ---------- DASHBOARD ---------- */
function tierStats(){
  const legacy = DB.settings.legacy_record||{};
  const live = DB.predictions.filter(p=>p.outcome);
  const t = {five:{h:legacy.five_star?.hits||0,t:legacy.five_star?.total||0}, four:{h:legacy.four_star?.hits||0,t:legacy.four_star?.total||0}, three:{h:0,t:0}, avoid:{h:legacy.avoid?.correct||0,t:legacy.avoid?.total||0}};
  for(const p of live){
    if(p.outcome==="AVOID_CORRECT"){t.avoid.h++;t.avoid.t++;continue;}
    if(p.outcome==="AVOID_INCORRECT"){t.avoid.t++;continue;}

/* ---------- COMBO ENGINE ---------- */
let SEL=new Set();
const COMBO_MIN_HIT=0.35;      // never surface a combo that hits less than 35 in 100
const COMBO_ROI_EDGE=0.05;     // and only if its ROI clearly beats betting the legs separately
const RFQ_MARKUP=1.05;         // market makers price combos above the product of legs
function legHit(p,a,b){
  const k=p.mkt&&p.mkt.k;
  if(k==="btts")return a>=1&&b>=1;
  if(k==="winner")return p.mkt.home? a>b : b>a;
  if(k==="no")return p.mkt.home? a<=b : b<=a;
  if(k==="over")return a+b>=3;
  if(k==="under")return a+b<=2;
  return false;
}
function gridMarginal(p,g){let s=0;for(let a=0;a<=7;a++)for(let b=0;b<=7;b++)if(legHit(p,a,b))s+=g[a][b];return s;}
function jointProb(legs){
  if(!legs.length)return null;
  const byFx={};
  for(const p of legs){ if(p.fid==null||!p.mkt)return null; (byFx[p.fid]=byFx[p.fid]||[]).push(p); }
  let prob=1;
  for(const fid in byFx){
    const grp=byFx[fid];
    if(grp.length===1){ prob*=grp[0].our/100; continue; }
    const g=BOARD&&BOARD.grids&&BOARD.grids[fid];
    if(!g)return null;
    let joint=0;
    for(let a=0;a<=7;a++)for(let b=0;b<=7;b++){ if(grp.every(p=>legHit(p,a,b))) joint+=g[a][b]; }
    // re-scale so each leg still matches the probability shown on its card, keeping the correlation
    for(const p of grp){ const m=gridMarginal(p,g); if(m>0.02) joint*=(p.our/100)/m; }
    prob*=joint;
  }

}
function comboQuote(legs){

  let price=1; for(const p of legs) price*=p.maxPrice/100;
  price=Math.max(0.01,Math.min(0.97,price*RFQ_MARKUP));
  const roi=prob/price-1;
  const singlesRoi=legs.reduce((a,p)=>a+((p.our/100)/(p.maxPrice/100)-1),0)/legs.length;
  const sameMatch=new Set(legs.map(p=>p.fid)).size<legs.length;
  const BK=+(DB.settings.bankroll&&DB.settings.bankroll.amount)||0;
  const kelly=Math.max(0,(prob-price)/(1-price))*0.25*0.5;   // quarter-Kelly, then halved for combo variance
  const stake=BK?Math.max(1,Math.round(BK*Math.min(0.025,Math.max(0.005,kelly)))):null;
  return {prob,price,roi,singlesRoi,sameMatch,stake,payout:stake?+(stake/price).toFixed(0):null,

function bestCombos(){

      if(q&&q.good)out.push({legs:cur.map(p=>p._i),q});
    }
    if(cur.length>=4)return;
    for(let i=start;i<pool.length;i++)rec(i+1,[...cur,pool[i]]);

const VERD_EDGE=4, VERD_FLOOR=50, VERD_COMBO_FLOOR=35;
function verdictFor(p){
  const bl=[]; let yes=true;
  const imp=p.maxPrice, edge=p.our-imp;
  if(p.locked){yes=false;bl.push("a PRS 8+ player is in doubt — hard rule 2 says wait for confirmed lineups");}
  if(edge<VERD_EDGE){yes=false;bl.push("edge is only "+edge.toFixed(1)+"pp over the price we can pay ("+imp+"c) — under the "+VERD_EDGE+"pp floor");}
  if(p.our<VERD_FLOOR){yes=false;bl.push("hit rate "+p.our+"% is below the "+VERD_FLOOR+"% floor for a single");}
  const E=p._E||{};
  if(E.lowSample){bl.push("early-season blend still active — ratings are part last-season");}
  const rs=(E.params&&E.params.regime_shave)||0;
  if(rs<=-15){yes=false;bl.push("regime shave "+rs+" — the ratings describe a squad that no longer exists");}
  else if(rs<0)bl.push("regime shave "+rs+" already applied");
  const drivers=[];
  if(E.base!=null)drivers.push("base xG rating "+(typeof E.base==="number"?E.base.toFixed(2):E.base));
  if(E.form&&E.form.v)drivers.push("form "+(E.form.v>0?"+":"")+E.form.v.toFixed(1)+"pp");
  if(E.arch&&E.arch.v)drivers.push("style matchup "+(E.arch.v>0?"+":"")+E.arch.v.toFixed(1)+"pp");
  if(E.h2h&&E.h2h.v)drivers.push("h2h xG "+(E.h2h.v>0?"+":"")+E.h2h.v.toFixed(1)+"pp");
  if(E.cong&&E.cong.v)drivers.push("rest/congestion "+(E.cong.v>0?"+":"")+E.cong.v.toFixed(1)+"pp");
  if(E.dos&&E.dos.v)drivers.push("dossier month cycle "+(E.dos.v>0?"+":"")+E.dos.v.toFixed(1)+"pp");
  const reasoning=(yes
    ?"YES — we make it "+p.our+"% and can pay up to "+imp+"c, an edge of "+edge.toFixed(1)+"pp. "
    :"NO — ")+(yes?"":bl[0]+". ")
    +(drivers.length?"What drove the number: "+drivers.join(", ")+". ":"")
    +(p.why||p.note||"")
    +(yes?" Flip me: confirmed absence of a PRS 8+ starter, or the price moving above "+imp+"c.":" Flip me: price drifting to "+(Math.round(p.our-VERD_EDGE))+"c or better"+(p.locked?", plus lineups confirming the doubtful player starts":"")+".");
  return {yes,edge:+edge.toFixed(1),blockers:bl,reasoning:reasoning.trim()};
}
function comboVerdict(c,legs){
  const bl=[]; let yes=true;
  if(c.prob<VERD_COMBO_FLOOR){yes=false;bl.push("joint hit rate "+c.prob+"% is under the "+VERD_COMBO_FLOOR+"% floor you set");}
  if(c.roi<=c.singles){yes=false;bl.push("ROI +"+c.roi+"% does not clearly beat betting the legs separately (+"+c.singles+"%)");}
  if(legs.some(p=>p.locked)){yes=false;bl.push("a leg is waiting on lineups");}
  const reasoning=(yes?"YES — ":"NO — ")
    +(yes?"":bl[0]+". ")
    +"Joint probability "+c.prob+"% priced as a "+legs.length+"-leg parlay, ROI +"+c.roi+"% against +"+c.singles+"% for the same legs bet singly"
    +(c.sameMatch?". Legs share a match, so the joint number is taken off the scoreline grid rather than multiplied — correlation is already accounted for":". Legs are independent matches, so probabilities multiply")
    +". Legs: "+legs.map(p=>p.bet+" ("+p.our+"%)").join(" + ")
    +(yes?". Flip me: any leg losing its lineup certainty, or the quoted price coming back worse than "+(c.stake&&c.payout?("$"+c.stake+" paying $"+c.payout):"quoted")+".":"");
  return {yes,blockers:bl,reasoning};
}

function typeStats(){

  for(const p of (PAPERS||[])){ if(!p.settled)continue;
    for(const o of (p.outcomes||[])){ const k=bucket(o.market||o.pick); S[k].t++; if(o.result==="HIT")S[k].h++;
      const pr=o.max_price||o.price; if(pr){S[k].ps+=pr;S[k].pn++;} } }
  for(const b of (DB.ledger||[])){ if(b.result!=="win"&&b.result!=="lose")continue;

    if(b.price_cents){S[k].ps+=b.price_cents;S[k].pn++;} }
  return S;
}

let ALLOC=null, ALLOCBUD=null, ALLOCMODE="kelly", ALLOCPIN={};
function allocKey(l){ return l.kind+"|"+l.i; }
function allocPin(key,val){
  const v=Math.max(0,Math.round(+val||0));
  ALLOCPIN[key]=v; runAllocKeep();
}
function allocUnpin(key){ delete ALLOCPIN[key]; runAllocKeep(); }
function allocResetPins(){ ALLOCPIN={}; runAllocKeep(); }
function computeAlloc(budget, plays, combos){
  const legs=[];
  for(const p of plays){
    if(p.our==null||p.locked)continue;
    const v=verdictFor(p); if(!v.yes)continue;
    const pr=p.our/100, c=p.maxPrice/100;
    const kelly=Math.max(0,(pr-c)/(1-c))*0.25;
    if(kelly<=0)continue;
    legs.push({kind:"single",i:p._i,label:p.bet,match:p.match,mult:100/p.maxPrice,w:kelly,pr,c});
  }
  for(let ci=0;ci<(combos||[]).length;ci++){
    const cb=combos[ci];
    const legsArr=cb.legs.map(i=>(BOARD.plays||[])[i]).filter(Boolean);
    const cv=comboVerdict(cb,legsArr); if(!cv.yes)continue;
    const pr=cb.prob/100, price=cb.stake&&cb.payout?cb.stake/cb.payout:0.42;
    const kelly=Math.max(0,(pr-price)/(1-price))*0.25*0.5;
    if(kelly<=0)continue;
    legs.push({kind:"combo",i:ci,label:legsArr.map(l=>l.bet).join(" + "),match:"combo",mult:cb.stake&&cb.payout?cb.payout/cb.stake:2.4,w:kelly,pr,c:price});
  }
  if(!legs.length)return {legs:[],spend:0,note:"No YES-verdict plays with positive edge right now — nothing worth allocating."};
  const wsum=legs.reduce((a,l)=>a+l.w,0);
  const kellySpend=Math.min(budget, budget*Math.min(1,wsum/0.12));
  const spend=ALLOCMODE==="all"?budget:Math.min(budget, Math.round(kellySpend));
  const cap=budget*0.4;
  const pinsTotal=legs.reduce((a,l)=>a+(ALLOCPIN[allocKey(l)]!=null?ALLOCPIN[allocKey(l)]:0),0);
  const pool=Math.max(0, spend-pinsTotal);
  const free=legs.filter(l=>ALLOCPIN[allocKey(l)]==null);
  const fw=free.reduce((a,l)=>a+l.w,0);
  let alloc=legs.map(l=>{
    const k=allocKey(l);
    if(ALLOCPIN[k]!=null) return {...l,amt:Math.min(ALLOCPIN[k],budget),pinned:true};
    return {...l,amt:fw>0?Math.min(cap, pool*l.w/fw):0,pinned:false};
  });
  const freeSum=alloc.filter(l=>!l.pinned).reduce((a,l)=>a+l.amt,0);
  if(freeSum>0){ const scale=pool/freeSum; alloc=alloc.map(l=>l.pinned?l:{...l,amt:Math.round(l.amt*scale)}); }
  alloc=alloc.filter(l=>l.amt>=1||l.pinned);
  const tot=alloc.reduce((a,l)=>a+l.amt,0);
  const overBudget=pinsTotal>budget?pinsTotal-budget:0;
  const ev=alloc.reduce((a,l)=>a+l.amt*(l.pr*l.mult-1),0);
  const maxWin=alloc.reduce((a,l)=>a+l.amt*(l.mult-1),0);
  return {legs:alloc,spend:tot,ev,maxWin,budget,underspend:budget-tot,overBudget,pinned:pinsTotal>0};
}
function runAlloc(){
  ALLOCPIN={};
  const b=+(document.getElementById("alloc_bud")||{}).value;
  if(!b||b<=0){toast("Type your matchday budget first",false);return;}
  ALLOCBUD=b;
  ALLOC=computeAlloc(b,(BOARD&&BOARD.plays||[]).filter(p=>p.our!=null&&p.type!=="live"),(BOARD&&BOARD.suggested)||[]);

}

  <div class="panel" style="border-color:var(--accent)"><div class="flex"><h2>⚡ Matchday Bet Board</h2>

function card(k,v,s,h,t){

}

  const mws=[...new Set(graded.map(p=>fxEv[p.fixture_id]||0))].sort((a,b)=>b-a);
  const reports=mws.map(mw=>{
    const G=graded.filter(p=>(fxEv[p.fixture_id]||0)===mw);
    const O=G.flatMap(p=>p.outcomes||[]);
    const h2=O.filter(o=>o.result==="HIT").length;
    const d2=O.reduce((a,o)=>a+wb(o),0);
    const PS=passes.filter(p=>(fxEv[p.fixture_id]||0)===mw);
    const psR=PS.filter(p=>String(p.analysis||"").includes("looks right")).length;
    const bt2={}; for(const o of O){const k=NAMES[o.market]||o.market;(bt2[k]||(bt2[k]={h:0,n:0}));bt2[k].n++;if(o.result==="HIT")bt2[k].h++;}
    const shaves=G.filter(p=>String(p.analysis||"").includes("Regime shave"));
    const shaveHits=shaves.flatMap(p=>p.outcomes||[]).filter(o=>o.result==="HIT").length;
    const shaveTot=shaves.flatMap(p=>p.outcomes||[]).length;
    const V2=(VERDS||[]).filter(v=>v.mw===mw&&v.correct!=null);
    const vy=V2.filter(v=>v.verdict==="YES"), vn=V2.filter(v=>v.verdict==="NO");
    const misses=G.filter(p=>(p.outcomes||[]).some(o=>o.result==="MISS"));
    const story=[
      `${h2} of ${O.length} picks landed${O.length?" ("+Math.round(100*h2/O.length)+"%)":""}, worth ${d2>=0?"+":"−"}$${Math.abs(d2).toFixed(0)} at $10 flat.`,
      Object.entries(bt2).map(([k,v])=>`${k} ${v.h}-${v.n-v.h}`).join(", ")+".",
      shaveTot?`Regime-shaved matches went ${shaveHits}-${shaveTot-shaveHits} — ${shaveHits/shaveTot>=0.5?"the shaves earned their keep":"the shaves may be miscalibrated; flagged for the discovery loop"}.`:"",
      V2.length?`My YES calls went ${vy.filter(v=>v.correct).length}-${vy.filter(v=>!v.correct).length}, my NO calls ${vn.filter(v=>v.correct).length}-${vn.filter(v=>!v.correct).length} (a NO is right when the bet would have lost).`:"",
      PS.length?`Quietly passed ${PS.length} match${PS.length>1?"es":""}; passing looked right in ${psR}.`:"",
      misses.length?`Lessons: ${misses.map(p=>esc(p.match)+" — "+esc((p.outcomes||[]).filter(o=>o.result==="MISS").map(o=>o.pick).join(", "))).join(" · ")}.`:"Nothing missed — stay suspicious of clean weeks."
    ].filter(Boolean).join(" ");
    return `<div class="panel" style="margin-top:10px;border-left:3px solid var(--accent);border-radius:0 10px 10px 0">
      <div class="flex rowbtn" style="cursor:pointer" onclick="EPREP=(EPREP===${mw}?null:${mw});render()">
        <b>Matchweek ${mw} report — what I chose and why</b>
        <span class="small right" style="color:${O.length&&h2/O.length>=0.55?"var(--green)":"var(--red)"}">${h2}/${O.length} hit · ${d2>=0?"+":"−"}$${Math.abs(d2).toFixed(0)}</span></div>
      ${EPREP===mw?`<p class="small" style="margin:8px 0 0;line-height:1.75">${story}</p>`:""}
    </div>`;
  }).join("");
  const cards=graded.slice().sort((a,b)=>String(b.kickoff).localeCompare(String(a.kickoff))).map(p=>{
    const o=p.outcomes||[], nH=o.filter(x=>x.result==="HIT").length;
    return `<div class="panel" style="margin-top:10px">
    <div class="flex"><b style="font-size:15px">${esc(p.match)} — ${esc(p.score||"")}</b>
      <span class="small muted">${p.kickoff?new Date(p.kickoff).toLocaleDateString([],{month:"short",day:"numeric"}):""}</span>
      <span class="tag ${nH===o.length?"hit":nH?"watch":"miss"} right">${nH} of ${o.length} hit</span></div>
    ${o.map(k=>`<div style="border-left:2px solid ${k.result==="HIT"?"var(--green)":"var(--red)"};padding:3px 0 3px 10px;margin:5px 0">
      <span class="tag ${k.result==="HIT"?"hit":"miss"}" style="margin-right:6px">${k.result}</span>
      <span class="small"><b>${esc(k.pick)}</b> — said <b class="num">${k.prob}%</b></span></div>`).join("")}
    ${p.analysis?`<div class="detail" style="margin-top:8px"><p class="small" style="margin:0">${esc(p.analysis)}</p></div>`:""}
    ${p.dan_notes?`<div class="detail" style="margin-top:6px;border-left:3px solid var(--accent);border-radius:0 10px 10px 0"><p class="small" style="margin:0"><b class="muted">YOUR NOTES:</b> ${esc(p.dan_notes)}</p>
      <button class="btn ghost sm" style="margin-top:4px" onclick="HWEDIT=${p.fixture_id};render()">edit</button></div>`:""}
    ${(!p.dan_notes||HWEDIT===p.fixture_id)?`<div class="flex" style="gap:8px;margin-top:6px">
      <input id="hw_${p.fixture_id}" placeholder="your homework: what did YOU see in this result?" style="flex:1" value="${esc(p.dan_notes||"")}">
      <button class="btn sm" onclick="saveHW(${p.fixture_id})">save notes</button></div>`:""}
  </div>`;}).join("");
  const acts={};
  for(const p of graded){
    const par=(p.engine&&p.engine.params)||{};
    for(const [k,v] of Object.entries(par)){
      if(k==="script"||v===0||v==null)continue;
      const a=acts[k]=acts[k]||{n:0,h:0,tot:0};
      for(const o of (p.outcomes||[])){a.n++;if(o.result==="HIT")a.h++;}
      a.tot++;
    }
  }
  const reg=((DB.settings.engine_params||{}).registry)||[];
  const attr=`<div class="panel" style="margin-top:12px"><h2>Parameter attribution — which ingredients earn their weight</h2>
    <p class="small muted" style="margin-bottom:8px">Every pick records which parameters pushed it. Verdicts unlock at 30 activations (whisper) and 100 (confident). Changes are proposed to you, never auto-applied.</p>
    <table><tr><th>Parameter</th><th>Fired in</th><th>Picks graded</th><th>Hit when active</th><th>Status</th></tr>
    ${reg.map(r=>{const a=acts[r.id];return `<tr><td><b class="small">${esc(r.name)}</b><br><span class="muted small">${esc(r.weight)}</span></td>
      <td class="num">${a?a.tot+" matches":"—"}</td><td class="num">${a?a.n:"0"}</td>
      <td class="num">${a&&a.n?Math.round(100*a.h/a.n)+"%":"—"}</td>
      <td class="small ${a&&a.n>=30?"":"muted"}">${a&&a.n>=100?"CONFIDENT":a&&a.n>=30?"whisper":"collecting ("+(a?a.n:0)+"/30)"}</td></tr>`;}).join("")}
    </table></div>`;
  return head+reports+cards+attr;
}

async function settleBet(id,won){
  const b=DB.ledger.find(x=>x.id===id); if(!b)return;
  const payout=won? +(b.stake*(100/b.price_cents)).toFixed(2) : 0;
  try{
    await api("bets_ledger?id=eq."+id,{method:"PATCH",body:{result:won?"win":"lose",payout}});
    toast(won?"Marked WIN +$"+(payout-b.stake).toFixed(0):"Marked LOSS"); loadAll();
  }catch(e){toast(e.message,false)}
}

function vLedger(){
  const L=DB.ledger||[];

  const staked=settled.reduce((a,b)=>a+ +b.stake,0);

  const pnl=ret-staked;
  const clvs=settled.filter(b=>b.closing_cents!=null).map(b=>b.closing_cents-b.price_cents);

    ${card("Avg CLV",avgClv==null?"—":((avgClv>0?"+":"")+avgClv.toFixed(1)+"¢"),clvs.length?clvs.length+" priced closes · positive = you beat the market":"log closing prices at kickoff")}
    ${card("Win rate",settled.length?Math.round(100*settled.filter(b=>b.result==="win").length/settled.length)+"%":"—","meaningful only vs prices paid")}

    <td class="num ${b.closing_cents!=null?(b.closing_cents>b.price_cents?"pos":"neg"):"muted"}">${b.closing_cents!=null?((b.closing_cents-b.price_cents>0?"+":"")+(b.closing_cents-b.price_cents)+"¢"):"—"}</td>
    <td>${b.result==="win"?`<span class="tag hit">WIN +$${(b.payout-b.stake).toFixed(0)}</span>`:b.result==="lose"?`<span class="tag miss">−$${b.stake}</span>`:`<button class="btn ghost sm" onclick="settleBet(${b.id},true)">W</button> <button class="btn ghost sm" onclick="settleBet(${b.id},false)">L</button>`}</td>
    <td><button class="btn ghost sm" onclick="delBet(${b.id})">✕</button></td></tr>`).join("")}</table>`

function inplaySide(t){
  const d=DOSS&&DOSS[t]; if(!d)return `<div class="panel"><p class="muted small">No dossier for ${esc(t)}.</p></div>`;
  const ht=d.ht_states||{}, fg=d.first_goal||{};
  const tim=d.timing_shares||{};
  const lay=ht.lead&&ht.lead.l>=14, never=ht.lead&&ht.lead.l<=4&&ht.lead.n>=30;
  const chaser=fg.conceded&&fg.conceded.ppg>=1.2, quitter=fg.conceded&&fg.conceded.ppg<=0.75;
  return `<div class="panel" style="flex:1;min-width:280px"><h2>${esc(t)}</h2>
    <p class="small"><b class="muted">FIRST GOAL:</b> score first → <b class="num pos">${fg.scored?fg.scored.ppg:"?"} PPG</b> · concede first → <b class="num ${quitter?"neg":""}">${fg.conceded?fg.conceded.ppg:"?"} PPG</b> ${quitter?'<span class="tag miss">QUITTERS</span>':chaser?'<span class="tag hit">CHASERS</span>':""}</p>
    <p class="small" style="margin-top:6px"><b class="muted">HT STATES:</b> lead → W${ht.lead?ht.lead.w:"?"}% L${ht.lead?ht.lead.l:"?"}% ${never?'<span class="tag hit">NEVER LAY</span>':lay?'<span class="tag miss">LAY-ABLE ('+ht.lead.l+'%)</span>':""} · level → W${ht.level?ht.level.w:"?"}% · behind → W${ht.behind?ht.behind.w:"?"}%</p>
    <p class="small" style="margin-top:6px"><b class="muted">GOAL WINDOWS:</b> scores most ${(()=>{const sc=tim.scored||{};const k=Object.keys(sc).sort((a,b)=>sc[b]-sc[a])[0];return k?`<b class="pos">${k}'</b> (${sc[k]}%)`:"?"})()} · leaks most ${(()=>{const c=tim.conceded||{};const k=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];return k?`<b class="neg">${k}'</b> (${c[k]}%)`:"?"})()}</p>
    ${d.card&&d.card.never&&d.card.never.length?`<p class="small" style="margin-top:6px"><b class="neg">NEVER:</b> ${d.card.never.map(esc).join(" · ")}</p>`:""}
  </div>`;
}
function vInplay(){
  const teams=Object.keys(DOSS||{}).sort();
  const opts=t=>`<option value="">— team —</option>`+teams.map(x=>`<option ${x===t?"selected":""}>${esc(x)}</option>`).join("");
  let plan="";
  if(inplayA&&inplayB&&DOSS[inplayA]&&DOSS[inplayB]){
    const dA=DOSS[inplayA],dB=DOSS[inplayB];
    const lines=[];
    if(dA.ht_states&&dA.ht_states.lead&&dA.ht_states.lead.l<=4)lines.push(`If ${inplayA} lead at HT and their YES trades under ~90¢ → buy (they close ${100-dA.ht_states.lead.l}% of leads).`);
    if(dB.ht_states&&dB.ht_states.lead&&dB.ht_states.lead.l>=14)lines.push(`If ${inplayB} lead at HT → buy NO on them if 15¢+ under fair (they blow ${dB.ht_states.lead.l}%).`);
    if(dA.first_goal&&dA.first_goal.conceded&&dA.first_goal.conceded.ppg<=0.75)lines.push(`If ${inplayA} concede first → their contract is dead money (${dA.first_goal.conceded.ppg} PPG chasing). Exit or fade.`);
    if(dB.first_goal&&dB.first_goal.conceded&&dB.first_goal.conceded.ppg<=0.75)lines.push(`If ${inplayB} concede first → same: ${dB.first_goal.conceded.ppg} PPG. The first goal settles this market.`);
    const aw=(dA.timing_shares&&dA.timing_shares.scored)||{};
    const hot=Object.keys(aw).sort((x,y)=>aw[y]-aw[x])[0];
    if(hot)lines.push(`${inplayA}'s hot window is ${hot}' — if the game is level entering it, their price is often stale.`);
    plan=lines.length?`<div class="panel" style="border-color:var(--accent)"><h2>The plan — written before kickoff, followed after</h2>${lines.map(l=>`<p class="small" style="margin:6px 0">▸ ${esc(l)}</p>`).join("")}<p class="small muted" style="margin-top:8px">Rule: decide entries/exits now, execute mechanically in-play. Live emotion is the house's edge.</p></div>`:"";
  }
  return `<div class="flex" style="margin-bottom:10px"><h2 style="color:var(--accent);font-size:14px;text-transform:uppercase;letter-spacing:1px">In-Play Card</h2>
    <select onchange="inplayA=this.value;renderInplay()">${opts(inplayA)}</select><span class="muted">vs</span>
    <select onchange="inplayB=this.value;renderInplay()">${opts(inplayB)}</select></div>
  ${inplayA||inplayB?`<div class="flex" style="align-items:stretch;gap:14px;flex-wrap:wrap">${inplayA?inplaySide(inplayA):""}${inplayB?inplaySide(inplayB):""}</div>${plan}`:'<p class="muted small">Pick the two teams of a live (or upcoming) match — get both dossiers side by side plus a pre-written trading plan for Kalshi in-play.</p>'}`;
}

async function ensureHist(){

function seasonList(){

function matchesFor(season){

  if(season===live) return DB.plf.filter(f=>f.finished&&f.team_h_name).map(f=>({season,home:f.team_h_name,away:f.team_a_name,fthg:f.team_h_score,ftag:f.team_a_score,match_date:f.kickoff?f.kickoff.slice(0,10):null,hthg:null,htag:null}));
  return (HIST||[]).filter(m=>m.season===season);

function tableFrom(ms){
  const t={};
  const touch=n=>t[n]||(t[n]={team:n,p:0,w:0,d:0,l:0,gf:0,ga:0,cs:0,pts:0,form:[],hw:0,hd:0,hl:0,aw:0,ad:0,al:0});
  const sorted=[...ms].filter(f=>f.fthg!=null).sort((a,b)=>String(a.match_date).localeCompare(String(b.match_date)));
  for(const f of sorted){
    const h=touch(f.home),a=touch(f.away);
    h.p++;a.p++;h.gf+=f.fthg;h.ga+=f.ftag;a.gf+=f.ftag;a.ga+=f.fthg;
    if(f.ftag===0)h.cs++; if(f.fthg===0)a.cs++;
    if(f.fthg>f.ftag){h.w++;h.hw++;a.l++;a.al++;h.pts+=3;h.form.push("W");a.form.push("L");}
    else if(f.fthg<f.ftag){a.w++;a.aw++;h.l++;h.hl++;a.pts+=3;a.form.push("W");h.form.push("L");}
    else{h.d++;h.hd++;a.d++;a.ad++;h.pts++;a.pts++;h.form.push("D");a.form.push("D");}
  }
  return Object.values(t).sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf);
}

/* --- profile charts --- */
function timingChart(t){
  if(!t)return '<p class="muted small">No timing data for this season.</p>';
  const bands=["1-15","16-30","31-45","46-60","61-75","76+"];
  const vals=bands.map(b=>({b,f:t[b]?.goals||0,a:(t[b]?.against?.goals)||0}));
  const max=Math.max(1,...vals.map(v=>Math.max(v.f,v.a)));
  const W=620,Hh=160,bw=32,gap=(W-50)/6;
  let out=`<svg viewBox="0 0 ${W} ${Hh+34}" style="max-width:660px;width:100%">`;
  vals.forEach((v,i)=>{const x=35+i*gap;
    const hf=Math.round(v.f/max*Hh*0.88), ha=Math.round(v.a/max*Hh*0.88);
    out+=`<rect x="${x}" y="${Hh-hf}" width="${bw}" height="${Math.max(hf,1)}" fill="var(--green)" rx="3"><title>scored ${v.f} (${v.b}')</title></rect>`;
    out+=`<rect x="${x+bw+5}" y="${Hh-ha}" width="${bw}" height="${Math.max(ha,1)}" fill="var(--red)" rx="3"><title>conceded ${v.a} (${v.b}')</title></rect>`;
    out+=`<text x="${x+bw}" y="${Hh+18}" fill="var(--muted)" font-size="11" text-anchor="middle">${v.b}'</text>`;
    out+=`<text x="${x+bw/2}" y="${Hh-hf-4}" fill="var(--green)" font-size="11" text-anchor="middle">${v.f||""}</text>`;
    out+=`<text x="${x+bw+5+bw/2}" y="${Hh-ha-4}" fill="var(--red)" font-size="11" text-anchor="middle">${v.a||""}</text>`;});
  out+=`</svg>`;
  const tot=vals.reduce((s2,v)=>s2+v.f,0)||1, tota=vals.reduce((s2,v)=>s2+v.a,0)||1;
  const best=vals.reduce((a,b)=>b.f>a.f?b:a), worst=vals.reduce((a,b)=>b.a>a.a?b:a);
  const late=vals[5].f+vals[4].f, early=vals[0].f+vals[1].f;
  return out+`<p class="small" style="margin-top:6px">Scores most in <b class="pos">${best.b}'</b> (${Math.round(best.f/tot*100)}% of goals) · most vulnerable <b class="neg">${worst.b}'</b> (${Math.round(worst.a/tota*100)}% conceded) · ${late>early?'<b>late-game team</b> ('+Math.round(late/tot*100)+'% of goals after 60 min)':early>late?'<b>fast starter</b> ('+Math.round(early/tot*100)+'% of goals before 30 min)':'evenly spread across the match'}</p>`;
}
function butterfly(matches){
  if(!matches||!matches.length)return '<p class="muted small">No match data.</p>';
  const W=640,mid=64,H=132,n=matches.length,step=(W-30)/n,bw=Math.max(3,Math.floor(step)-2);
  let out=`<svg viewBox="0 0 ${W} ${H}" style="max-width:680px;width:100%">`;
  out+=`<line x1="0" y1="${mid}" x2="${W}" y2="${mid}" stroke="var(--border)"/>`;
  matches.forEach((m,i)=>{const x=15+i*step;
    out+=`<rect x="${x}" y="${mid-m.gf*11}" width="${bw}" height="${Math.max(m.gf*11,1)}" fill="var(--green)" opacity=".9"><title>${m.date} ${m.side==="h"?"vs":"@"} ${m.opp}: ${m.gf}-${m.ga} (${(m.result||"").toUpperCase()})</title></rect>`;
    out+=`<rect x="${x}" y="${mid+1}" width="${bw}" height="${Math.max(m.ga*11,1)}" fill="var(--red)" opacity=".9"><title>${m.date} ${m.side==="h"?"vs":"@"} ${m.opp}: ${m.gf}-${m.ga}</title></rect>`;});
  out+=`</svg><p class="small muted">Each bar = one match in season order. Green up = scored, red down = conceded. Hover for details.</p>`;
  return out;
}
function halfSplit(team,season){
  const ms=(HIST||[]).filter(m=>m.season===season&&(m.home===team||m.away===team)&&m.hthg!=null);
  let s1=0,s2=0,c1=0,c2=0;
  for(const m of ms){const home=m.home===team;
    const gf1=home?m.hthg:m.htag, ga1=home?m.htag:m.hthg;
    const gf=home?m.fthg:m.ftag, ga=home?m.ftag:m.fthg;
    s1+=gf1;s2+=gf-gf1;c1+=ga1;c2+=ga-ga1;}
  return {s1,s2,c1,c2,n:ms.length};
}
function styleChips(st){

  const chips=[];

function drawEmp(favP){
  if(!DRAWTAB){
    DRAWTAB=[];
    const rows=(HIST||[]).filter(m=>m.b365h&&m.b365d&&m.b365a&&m.fthg!=null);
    const b=[0.40,0.48,0.56,0.64,0.72,0.85,1.01];
    for(let i=0;i<b.length-1;i++){
      const set=rows.filter(m=>{const s2=1/m.b365h+1/m.b365d+1/m.b365a;const p=Math.max((1/m.b365h)/s2,(1/m.b365a)/s2);return p>=b[i]&&p<b[i+1];});
      DRAWTAB.push({lo:b[i],hi:b[i+1],n:set.length,dr:set.length?set.filter(m=>m.fthg===m.ftag).length/set.length:0.25});
    }
  }
  const hit=DRAWTAB.find(x=>favP>=x.lo&&favP<x.hi);
  return hit&&hit.n>30?hit.dr:0.25;

/* ---- ratings & poisson ---- */
function teamRate(team,season){
  const pr=PROFIX[team+"|"+season];
  if(!pr||!pr.matches||!pr.matches.length)return null;
  const ms=pr.matches, n=ms.length, w=i=>Math.pow(0.93,n-1-i);
  let hx=0,hxa=0,hw=0,ax=0,axa=0,aw=0;
  ms.forEach((m,i)=>{const W=w(i); if(m.side==="h"){hx+=m.xg*W;hxa+=m.xga*W;hw+=W;} else {ax+=m.xg*W;axa+=m.xga*W;aw+=W;}});
  return {ah:hw?hx/hw:1.4, dh:hw?hxa/hw:1.4, aa:aw?ax/aw:1.2, da:aw?axa/aw:1.5, n};
}
function blendRate(team,season){
  const cur=teamRate(team,season);
  const seasons=Object.keys(PROFIX).filter(k=>k.startsWith(team+"|")).map(k=>k.split("|")[1]).sort();
  const prevSeason=seasons.filter(x=>x<season).pop();
  const prev=prevSeason?teamRate(team,prevSeason):null;
  if(cur&&(!prev||cur.n>=12))return {...cur,blended:false};
  if(cur&&prev){ const w=cur.n/(cur.n+8);
    return {ah:cur.ah*w+prev.ah*(1-w), dh:cur.dh*w+prev.dh*(1-w), aa:cur.aa*w+prev.aa*(1-w), da:cur.da*w+prev.da*(1-w), n:cur.n, blended:true};
  }
  return prev?{...prev,n:0,blended:true}:null;
}
function leagueAvg(season){
  let sx=0,c=0;
  for(const p of ALLPROF) if(p.season===season) for(const m of p.matches){sx+=m.xg;c++;}
  return c?sx/c:1.4;
}
function pois(l,k){let p=Math.exp(-l);for(let i=1;i<=k;i++)p*=l/i;return p;}
function dcGrid(gA,gB){
  // Dixon-Coles corrected scoreline matrix (normalised) — the basis for combo joint probabilities
  const RHO=-0.11;
  const tau=(x,y)=>x===0&&y===0?1-gA*gB*RHO:x===0&&y===1?1+gA*RHO:x===1&&y===0?1+gB*RHO:x===1&&y===1?1-RHO:1;
  const g=[];let tot=0;
  for(let a=0;a<=7;a++){g[a]=[];for(let b=0;b<=7;b++){let p=pois(gA,a)*pois(gB,b)*tau(a,b);if(p<0)p=0;g[a][b]=p;tot+=p;}}
  for(let a=0;a<=7;a++)for(let b=0;b<=7;b++)g[a][b]=g[a][b]/tot;
  return g;
}
function poissonWDL(gA,gB){
  const g=dcGrid(gA,gB);
  let w=0,d=0,l=0,o=0,bt=0,best={p:0,s:"1-1"};
  for(let a=0;a<=7;a++)for(let b=0;b<=7;b++){const p=g[a][b];
    if(a>b)w+=p;else if(a===b)d+=p;else l+=p;
    if(a+b>=3)o+=p;
    if(a>=1&&b>=1)bt+=p;
    if(p>best.p)best={p,s:a+"-"+b};}
  return {w,d,l,o,btts:bt,best:best.s,grid:g};
}

/* ---- archetypes & patterns ---- */
function archOf(st){
  const a=[]; if(!st)return a;
  if(st._ppda!=null){ if(st._ppda<9.5)a.push("HIGH-PRESS"); else if(st._ppda>12.5)a.push("LOW-BLOCK"); }
  const sit=st.situation||{}; const tot=Object.values(sit).reduce((x,y)=>x+(y.goals||0),0)||1;
  const sp=((sit["FromCorner"]||{}).goals||0)+((sit["SetPiece"]||{}).goals||0)+((sit["DirectFreekick"]||{}).goals||0);
  if(sp/tot>0.3)a.push("SET-PIECE");
  const spd=st.attackSpeed||{}; const stot=Object.values(spd).reduce((x,y)=>x+(y.goals||0),0)||1;
  if(((spd["Fast"]||{}).goals||0)/stot>0.25)a.push("TRANSITION");
  if(st._deep_per_match>=8)a.push("TERRITORIAL");
  return a;
}
function rotWeight(team,date){
  if(!ROTIX)return 1;
  const r=ROTIX[team+"|"+date];
  return r!=null&&r>=4?0.3:1;
}
function formAdj(team,season){
  const pr=PROFIX[team+"|"+season]; if(!pr||!pr.matches.length)return {v:0,n:0};
  const last=pr.matches.slice(-6);
  let sum=0,wt=0;
  last.forEach((m,i)=>{const W=(i+1)*rotWeight(team,m.date); sum+=(m.xg-m.xga)*W; wt+=W;});
  const v=wt?Math.max(-4,Math.min(4,(sum/wt)*2.2)):0;
  return {v:+v.toFixed(1),n:last.length};
}
function archPerf(team,arch){
  let pts=0,n=0,allPts=0,allN=0;
  for(const p of (PROFILES[team]||[])){
    for(const m of p.matches){
      const res=m.result==="w"?3:m.result==="d"?1:0;
      allPts+=res;allN++;
      const op=PROFIX[m.opp+"|"+p.season];
      if(op&&archOf(op.stats).includes(arch)){pts+=res;n++;}
    }
  }
  if(!n||!allN)return {v:0,n:0};
  const d=(pts/n)-(allPts/allN);
  return {v:+Math.max(-4,Math.min(4,d*3)).toFixed(1),n};
}
function h2hEvidence(A,B){
  const meets=[];
  for(const p of (PROFILES[A]||[])) for(const m of p.matches) if(m.opp===B) meets.push(m);
  if(!meets.length)return {v:0,n:0};
  let sum=0,wt=0;
  meets.forEach((m,i)=>{const W=i+1; sum+=(m.xg-m.xga)*W; wt+=W;});
  return {v:+Math.max(-3,Math.min(3,(sum/wt)*1.5)).toFixed(1),n:meets.length};
}
function allMatchDates(team){
  const ds=[];
  for(const f of DB.plf) if(f.started&&f.kickoff&&(f.team_h_name===team||f.team_a_name===team)) ds.push(f.kickoff);
  for(const c of (CAL||[])) if(c.kickoff&&(c.home===team||c.away===team)) ds.push(c.kickoff);
  return ds.sort();
}
function congestionAt(team,dateStr){
  const d=dateStr?new Date(dateStr):new Date();
  const ds=allMatchDates(team).map(x=>new Date(x));
  const prior=ds.filter(x=>x<d&&(d-x)<45*864e5);
  const in14=prior.filter(x=>(d-x)<=14*864e5).length;
  const rest=prior.length?Math.round((d-prior[prior.length-1])/864e5):null;
  const next=ds.find(x=>x>d);
  const sandwich=next?(next-d)<=4*864e5:false;
  return {in14,rest,sandwich};
}
function stakesOf(team){
  const live=SEASON_LIVE(); if(!live)return {tag:"OFF",label:"season not started"};

  const pos=tb.indexOf(me)+1, left=38-me.p;
  const top=tb[0].pts-me.pts, top4=(tb[3]?tb[3].pts:0)-me.pts, rel=me.pts-(tb[17]?tb[17].pts:0);
  if(top<=4&&left>0)return {tag:"F",label:`TITLE RACE — ${top===0?"top":top+" pts off top"}, ${left} left`};
  if(Math.abs(top4)<=4)return {tag:"F",label:`TOP-4 RACE — ${top4>0?top4+" pts off 4th":"holding 4th zone"}`};
  if(rel<=6)return {tag:"F",label:`RELEGATION FIGHT — ${rel} pts above the line`};
  if(top>8&&rel>8&&Math.abs(top4)>8)return {tag:"S",label:`SAFE (${pos}th) — nothing left to play for`};
  return {tag:"M",label:`mid-stakes (${pos}th)`};
}
function priorityConflict(team,kick){

function stakesChip(st){return st.tag==="F"?chipHtml(st.label,"danger"):st.tag==="S"?chipHtml(st.label,"warning"):"";}
function scriptPredict(stA,stB,prA,prB){
  const aA=archOf(stA), aB=archOf(stB);
  const topForm=st=>{const f=Object.values((st&&st.formation)||{}).sort((x,y)=>(+y.time||0)-(+x.time||0))[0];return f?f.stat:null;};
  const fA=topForm(stA), fB=topForm(stB);
  if(aA.includes("HIGH-PRESS")&&aB.includes("TRANSITION"))return {code:"E PRESS TRAP",why:"your side presses high into a fast-transition outlet — tail risk",lean:"BTTS Yes"};
  if(aB.includes("HIGH-PRESS")&&aA.includes("TRANSITION"))return {code:"E PRESS TRAP (favorable)",why:"opponent presses into YOUR transition threat",lean:"BTTS Yes"};
  if(aB.includes("LOW-BLOCK")&&(aA.includes("TERRITORIAL")||aA.includes("HIGH-PRESS")))return {code:"A SIEGE",why:"possession/territory vs a low block — draws spike, favorites overpriced",lean:"Under 2.5"};
  if(aA.includes("LOW-BLOCK")&&(aB.includes("TERRITORIAL")||aB.includes("HIGH-PRESS")))return {code:"A SIEGE (you defend it)",why:"you are the block — chaos favors you late",lean:"Under 2.5"};
  if(aA.includes("HIGH-PRESS")&&aB.includes("HIGH-PRESS"))return {code:"B OPEN EXCHANGE",why:"both press high — quality expresses, game opens",lean:"Over 2.5 / BTTS"};
  if(fA&&fB&&fA[0]==="3"&&fB&&/4-2-3-1|4-3-3/.test(fB))return {code:"D WING OVERLOAD",why:`back-3 wing-backs (${fA}) vs narrow ${fB}`,lean:"Moderate"};
  if(fA&&fB&&fA===fB)return {code:"C MIRROR",why:`same shape (${fA}) — PRS weight increases ~50%`,lean:"Moderate"};
  return {code:"C MIRROR-ish",why:"no dominant style collision detected",lean:"Follow expected goals"};
}

/* ---- the matchup engine ---- */
function matchupEngine(A,B,venueHome){
  const season=plSeason;
  const rA=blendRate(A,season), rB=blendRate(B,season);
  if(!rA||!rB)return null;
  const L=leagueAvg(season)||1.4;
  const gA=venueHome? rA.ah*rB.da/L : rA.aa*rB.dh/L;
  const gB=venueHome? rB.aa*rA.dh/L : rB.ah*rA.da/L;
  const P=poissonWDL(gA,gB);
  const emp=drawEmp(Math.max(P.w,P.l));
  const pd=(P.d+emp)/2;
  const scale=(1-pd)/(P.w+P.l||1);
  let win=P.w*scale*100;
  const fa=formAdj(A,season), fb=formAdj(B,season);
  const form={v:+Math.max(-4,Math.min(4,fa.v-fb.v)).toFixed(1),n:Math.min(fa.n,fb.n)};
  const stA=(PROFIX[A+"|"+season]||{}).stats, stB=(PROFIX[B+"|"+season]||{}).stats;
  const aB=archOf(stB);
  let arch={v:0,n:0};
  for(const ar of aB){const ap=archPerf(A,ar); if(Math.abs(ap.v)>Math.abs(arch.v))arch={...ap,vs:ar};}
  const h2h=h2hEvidence(A,B);
  const cgA=congestionAt(A,null), cgB=congestionAt(B,null);
  let cong={v:0,note:""};
  if(cgA.rest!=null&&cgB.rest!=null&&cgA.rest<20&&cgB.rest<20){
    cong.v=+Math.max(-3,Math.min(3,(Math.min(cgA.rest,9)-Math.min(cgB.rest,9))*0.7)).toFixed(1);
    cong.note=`${A} ${cgA.rest}d rest (${cgA.in14} games/14d)${cgA.sandwich?" SANDWICH":""} vs ${B} ${cgB.rest}d (${cgB.in14}/14d)${cgB.sandwich?" SANDWICH":""}`;
  }
  const script=scriptPredict(stA,stB);
  if(koMode!=="league") win=50+(win-50)*0.85; // knockout compression: upsets more likely, models less accurate
  const dosA=dossierAdj(A,B,venueHome), dosB=dossierAdj(B,A,!venueHome);
  const dos={v:+(dosA.v-dosB.v).toFixed(1), notes:[...dosA.notes,...dosB.notes.map(n=>"(opp) "+n)], cardA:dosA.card, cardB:dosB.card, cascade:[...(dosA.cascade||[]),...(dosB.cascade||[])], marketA:dosA.market, totalsA:dosA.totals};
  const base=Math.round(Math.max(15,Math.min(85,win+form.v+arch.v+h2h.v+cong.v+dos.v)));
  const relOf=t=>{const ps=DB.players.filter(p=>p.team===t&&p.xgi_share!=null&&p.xgi_share>0);return ps.length?ps.sort((a,b)=>b.xgi_share-a.xgi_share)[0]:null;};
  const relA=relOf(A), relB=relOf(B);
  const alerts=DB.players.filter(p=>(p.team===A||p.team===B)&&p.prs>=8&&p.status&&p.status!=="fit"&&p.status!=="unavailable");
  const lowSample=rA.n<8||rB.n<8;
  return {gA:+gA.toFixed(2),gB:+gB.toFixed(2),poisson:{w:+(P.w*scale*100).toFixed(1),d:+(pd*100).toFixed(1),l:+(P.l*scale*100).toFixed(1),o:+(P.o*100).toFixed(1),btts:+(P.btts*100).toFixed(1),best:P.best},
    win:+win.toFixed(1),form,arch,h2h,cong,script,base,alerts,lowSample,blended:rA.blended||rB.blended,nA:rA.n,nB:rB.n,
    totalG:+(gA+gB).toFixed(2),relA,relB,dos,grid:P.grid};
}

function calendarPanel(team){
  if(!CAL)return "";
  const now=new Date();
  const mine=CAL.filter(c=>c.home===team||c.away===team);
  const past=mine.filter(c=>c.kickoff&&new Date(c.kickoff)<now).slice(-5);
  const next=mine.filter(c=>c.kickoff&&new Date(c.kickoff)>=now).slice(0,5);
  const plNext=DB.plf.filter(f=>!f.started&&f.kickoff&&(f.team_h_name===team||f.team_a_name===team)).slice(0,5)
    .map(f=>({comp:"PL",round:"MW"+f.event,kickoff:f.kickoff,home:f.team_h_name,away:f.team_a_name}));
  const upcoming=[...next,...plNext].sort((a,b)=>new Date(a.kickoff)-new Date(b.kickoff)).slice(0,6);
  // congestion sensitivity: PL results split by rest days (using all-comp calendar)
  const plms=DB.plf.filter(f=>f.finished&&(f.team_h_name===team||f.team_a_name===team)&&f.kickoff);
  let cN=0,cP=0,rN=0,rP=0;
  for(const f of plms){
    const cg=congestionAt(team,f.kickoff);
    if(cg.rest==null)continue;
    const home=f.team_h_name===team;
    const pts=(home?f.team_h_score>f.team_a_score:f.team_a_score>f.team_h_score)?3:(f.team_h_score===f.team_a_score?1:0);
    if(cg.rest<=4){cN++;cP+=pts;} else {rN++;rP+=pts;}
  }
  const chip=c=>`<span class="tag ${c==="PL"?"pend":c==="UCL"?"watch":c==="FA Cup"||c==="EFL Cup"?"hit":"avoid"}" style="margin-right:6px">${esc(c)}</span>`;
  return `<div class="panel"><h2>Calendar & Congestion — all competitions</h2>
  ${upcoming.length?`<p class="small muted" style="margin-bottom:4px">NEXT UP:</p>${upcoming.map(c=>`<div class="flex" style="margin:3px 0">${chip(c.comp)}<span class="num small">${new Date(c.kickoff).toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}</span><span class="small">${esc(c.home)} vs ${esc(c.away)}</span></div>`).join("")}`:`<p class="muted small">No upcoming fixtures on the calendar yet.</p>`}
  ${past.length?`<p class="small muted" style="margin:10px 0 4px">RECENT (cups/Europe):</p>${past.map(c=>`<div class="flex" style="margin:3px 0">${chip(c.comp)}<span class="num small">${c.event_date||""}</span><span class="small">${esc(c.home)} <b class="num">${c.home_score??""}${c.home_score!=null?"-":""}${c.away_score??""}</b> ${esc(c.away)}</span></div>`).join("")}`:""}
  ${(cN>=3&&rN>=3)?`<p class="small" style="margin-top:10px"><b class="muted">CONGESTION SENSITIVITY (PL, ${plms.length} matches):</b> ≤4 days rest → <b class="num ${cP/cN<rP/rN?"neg":"pos"}">${(cP/cN).toFixed(2)} PPG</b> (${cN} games) vs rested → <b class="num">${(rP/rN).toFixed(2)} PPG</b> (${rN}) ${cP/cN<rP/rN-0.4?`<span class="tag miss">FATIGUE-SENSITIVE</span>`:cP/cN>rP/rN?`<span class="tag hit">HANDLES LOAD</span>`:""}</p>`:`<p class="small muted" style="margin-top:10px">Congestion sensitivity: needs more matches with short rest this season (LOW SAMPLE).</p>`}
  </div>`;
}

function marketPanel(){
  const rows=(HIST||[]).filter(m=>m.b365h&&m.b365d&&m.b365a&&m.fthg!=null);
  if(rows.length<100)return "";
  const bands=[[0.40,0.50],[0.50,0.60],[0.60,0.70],[0.70,0.80],[0.80,1.01]].map(([lo,hi])=>({lo,hi,n:0,wins:0,imp:0}));
  let dn=0,dw=0,dimp=0;
  for(const m of rows){
    const s2=1/m.b365h+1/m.b365d+1/m.b365a;
    const ph=(1/m.b365h)/s2, pa2=(1/m.b365a)/s2, pd=(1/m.b365d)/s2;
    dn++; dimp+=pd; if(m.fthg===m.ftag)dw++;
    const fav=ph>=pa2?{p:ph,won:m.fthg>m.ftag}:{p:pa2,won:m.ftag>m.fthg};
    for(const b of bands) if(fav.p>=b.lo&&fav.p<b.hi){b.n++;b.imp+=fav.p;if(fav.won)b.wins++;}
  }
  return `<div class="panel"><details><summary style="cursor:pointer"><b style="color:var(--accent)">MARKET BACKTEST</b> <span class="muted small">· ${rows.length} matches · closing odds, overround-stripped · click to expand</span></summary>
  <table style="margin-top:10px"><tr><th>Favorite priced</th><th>Matches</th><th>Market implied</th><th>Actually won</th><th>Market error</th></tr>
  ${bands.filter(b=>b.n>10).map(b=>{const imp=b.imp/b.n*100, act=b.wins/b.n*100, e=act-imp;return `<tr><td class="num">${Math.round(b.lo*100)}-${Math.round((b.hi>1?1:b.hi)*100)}%</td><td class="num">${b.n}</td><td class="num">${imp.toFixed(1)}%</td><td class="num">${act.toFixed(1)}%</td><td class="num ${e>0?"pos":"neg"}">${e>0?"+":""}${e.toFixed(1)}pp</td></tr>`}).join("")}
  <tr><td>Draws (all matches)</td><td class="num">${dn}</td><td class="num">${(dimp/dn*100).toFixed(1)}%</td><td class="num">${(dw/dn*100).toFixed(1)}%</td><td class="num ${dw/dn>dimp/dn?"pos":"neg"}">${((dw/dn-dimp/dn)*100).toFixed(1)}pp</td></tr></table>
  <p class="small muted" style="margin-top:8px">Negative = market overprices that band. Where favorites underdeliver vs implied, the Script A SIEGE thesis (favorites vs low blocks are systematically overpriced) has 5 seasons of evidence.</p></details></div>`;
}

function sideRank(pos){ if(/L$/.test(pos)&&!/CL$/.test(pos))return 0; if(/CL$/.test(pos))return 1; if(/CR$/.test(pos))return 3; if(/R$/.test(pos)&&!/CR$/.test(pos))return 4; return 2; }
function lineupSlots(L){
  const lines={G:[],D:[],DM:[],M:[],AM:[],F:[]};
  (L.players||[]).forEach((p,idx)=>lines[posLine(p.pos)].push({...p,_idx:idx}));
  const LX={G:38,D:112,DM:200,M:283,AM:365,F:470};
  const slots=[];
  for(const k of ["G","D","DM","M","AM","F"]){
    const arr=lines[k]; if(!arr.length)continue;
    arr.sort((a,b)=>sideRank(a.pos)-sideRank(b.pos)||a.order-b.order);
    const ys=spreadY(arr.length);
    arr.forEach((p,i)=>slots.push({x:LX[k],y:ys[i]+(k==="G"?0:0),p}));
  }
  return slots;
}
function fmtLabel(L){
  const c={D:0,DM:0,M:0,AM:0,F:0};
  (L.players||[]).forEach(p=>{const k=posLine(p.pos); if(k!=="G")c[k]++;});
  const bands=[];
  if(c.D)bands.push(c.D);
  if(c.DM&&c.M)bands.push(c.DM+c.M); else if(c.DM)bands.push(c.DM); else if(c.M)bands.push(c.M);
  if(c.AM)bands.push(c.AM);
  if(c.F)bands.push(c.F);
  return bands.join("-");
}
function nextFx(team){
  return (DB.plf||[]).filter(f=>!fxDone(f)&&(f.team_h_name===team||f.team_a_name===team)).sort((a,b)=>new Date(a.kickoff)-new Date(b.kickoff))[0];
}
function collision(team,opp){
  const p1=(TPST[team]||{})._ppda, p2=(TPST[opp]||{})._ppda;
  if(!p1||!p2)return "";
  const t=x=>x<=9?"press":(x>=13?"block":"mid");
  const a=t(p1),b=t(p2);
  let v= a==="press"&&b==="block"?"press should pin the block": b==="press"&&a==="block"?"their press vs our block — first goal decides": a==="press"&&b==="press"?"mirror-press chaos":"even styles";
  return `<b>${p1}</b> vs <b>${p2}</b> — R3: ${v}`;
}

/* ---------- CALCULATOR ---------- */
function vCalc(){
  return `
  <div class="panel"><h2>Pipeline Calculator — base → PRS → AIS → TMS → context</h2>
  <div class="formrow">
    <label>Base probability %<input id="c_base" type="number" value="${CALCPRE||50}" style="width:90px" oninput="calc()"></label>
    <label>PRS adjustment % (cap ±15)<input id="c_prs" type="number" value="0" style="width:90px" oninput="calc()"></label>
    <label>TMS adjustment % (cap ±6)<input id="c_tms" type="number" value="0" style="width:90px" oninput="calc()"></label>
    <label>Context % <input id="c_ctx" type="number" value="0" style="width:90px" oninput="calc()"></label>
  </div>
  <div class="formrow">
    <label>Home venue altitude (m)<input id="c_alt1" type="number" value="0" style="width:100px" oninput="calc()"></label>
    <label>Visitor origin altitude (m)<input id="c_alt2" type="number" value="0" style="width:100px" oninput="calc()"></label>
    <label>Is your pick the high-altitude side?<select id="c_side" onchange="calc()"><option value="1">Yes (+)</option><option value="-1">No (−)</option><option value="0">No altitude factor</option></select></label>
    <label><span>PRS 8+ in doubt?</span><input type="checkbox" id="c_doubt" style="width:20px;height:20px" onchange="calc()"></label>
    <label>Competition<select id="c_ko" onchange="calc()"><option value="league">League</option><option value="ko">Knockout (single tie)</option><option value="ko2">Knockout (two legs)</option></select></label>
  </div>
  <div class="calcout" id="c_out"></div>
  <p class="small muted" style="margin-top:10px">Stars auto-suggest from the final number. The lineup rule overrides everything: unresolved PRS 8+ doubt = AVOID until confirmed XIs, no exceptions.</p>
  </div>`;
}
function calc(){
  const g=id=>+document.getElementById(id).value||0;
  const base=g("c_base"), prs=cap(g("c_prs"),15), tms=cap(g("c_tms"),6), ctx=g("c_ctx");
  const side=+document.getElementById("c_side").value;
  const gap=Math.max(0,g("c_alt1")-g("c_alt2"));
  const goals=gap/1000*0.5, ais=side===0?0:Math.round(goals*11)*side;
  let final=Math.round(base+prs+ais+tms+ctx);
  const ko=document.getElementById("c_ko")?document.getElementById("c_ko").value:"league";
  if(ko==="ko") final=Math.round(50+(final-50)*0.85);
  const doubt=document.getElementById("c_doubt").checked;
  let stars,action;
  if(doubt){stars="⭐⭐";action="🚫 AVOID — PRS 8+ doubt unresolved. Wait for confirmed lineups (Rodri rule).";}
  else if(final>=65){stars="⭐⭐⭐⭐⭐";action="Bet with confidence";}
  else if(final>=50){stars="⭐⭐⭐⭐";action="Standard bet";}
  else if(final>=45){stars="⭐⭐⭐";action="Goals markets only / small";}
  else {stars="⭐⭐";action="🚫 AVOID — below threshold";}
  document.getElementById("c_out").innerHTML=`
    <div class="layers" style="justify-content:center">
      <div class="step"><div class="lk">Base</div><div class="lv">${base}%</div></div><div class="arr">→</div>
      <div class="step"><div class="lk">PRS</div><div class="lv">${prs>0?"+":""}${prs}%</div></div><div class="arr">→</div>
      <div class="step"><div class="lk">AIS</div><div class="lv">${ais>0?"+":""}${ais}%${gap>0&&side!==0?`<div class="small muted">${goals.toFixed(2)} goals</div>`:""}</div></div><div class="arr">→</div>
      <div class="step"><div class="lk">TMS</div><div class="lv">${tms>0?"+":""}${tms}%</div></div><div class="arr">→</div>
      <div class="step"><div class="lk">Ctx</div><div class="lv">${ctx>0?"+":""}${ctx}%</div></div>
    </div>
    <div class="big">${final}%</div>
    <div class="stars" style="font-size:22px">${stars}</div>
    <div style="margin-top:6px;font-weight:700;color:${action.startsWith("🚫")?"var(--red)":"var(--green)"}">${action}</div>
    ${ko==="ko"?`<p class="small muted" style="margin-top:6px">Knockout compression applied (−15% toward coin-flip): upsets are likelier and models weaker in one-off ties. Expect heavier rotation in early cup rounds — check the calendar.</p>`:ko==="ko2"?`<p class="small muted" style="margin-top:6px">Two-legged tie: judge the AGGREGATE, not the leg. Leg-1 favorites often manage games; the leg-2 away side knows exactly what it needs.</p>`:""}
    <p class="small muted" style="margin-top:4px">ENV layer: altitude above · weather counts too — wind 25km/h+ cuts long passing and totals; extreme heat slows tempo (cap weather at ±2-3% context; totals lean stronger than winner lean).</p>`;
}

const IMPORT_SPEC = {
  version: 1,
  predictions: [{entry_no:26, match:"Team A vs Team B", competition:"Premier League", match_date:"2026-08-15", venue:"Anfield", stage:"predicted", pick:"Team A", base_prob:55, prs_adj:-4, ais_adj:0, tms_adj:3, context_adj:1, final_prob:55, stars:4, game_script:"B OPEN EXCHANGE", bets:[{market:"BTTS",pick:"Yes",prob:60}], is_avoid:false, lineup_watch:true, lineup_watch_note:"Player X (PRS 9) doubtful", layer_notes:{prs:"X doubtful -4%",tms:"open exchange +3%"}, fixture_id:null}],
  settle: [{entry_no:25, result:"Mexico 2-1", outcome:"HIT", audit_notes:"", closing_odds:2.4}],
  players: [{name:"Player", team:"Team", position:"ST", prs:8, status:"fit", fitness_pct:null, hot_streak:false, penalty_taker:false, set_piece_taker:false, notes:""}],
  coaches: [{name:"Coach", team:"Team", formations:"4-3-3", press:8, poss:7, risk:6, adapt:5, notes:""}],
  venues: [{stadium:"Stadium", city:"City", country:"Country", altitude_m:0, new_stadium:false, notes:""}],
  news: [{item_date:"2026-08-14", tag:"injury", headline:"...", body:"", match:"Team A vs Team B"}]
};
function vData(){
  return `
  <div class="panel"><h2>Paste-in JSON Import</h2>
  <p class="small muted" style="margin-bottom:8px">End an analysis session by asking Claude for an "import block" in the Hub format. Paste it here — predictions insert, entries settle by entry_no, players/coaches/venues upsert by name+team.</p>
  <textarea id="imp" rows="12" placeholder='{"version":1,"predictions":[...],"players":[...]}'></textarea>
  <div class="flex" style="margin-top:10px"><button class="btn" onclick="runImport()">Import</button>
  <button class="btn ghost" onclick="document.getElementById('imp').value=JSON.stringify(IMPORT_SPEC,null,2)">Show format example</button></div>
  <div id="impres" class="small" style="margin-top:8px"></div></div>

  <div class="panel"><h2>Session Briefing Export</h2>
  <p class="small muted" style="margin-bottom:8px">One click → a context block to paste into a new Claude session. Includes current record, open calls, lineup watches, PRS notables, hard rules, and the import format so the session can emit updates back.</p>
  <div class="flex"><button class="btn" onclick="briefing()">Generate briefing</button><button class="btn ghost" onclick="copyBrief()">Copy to clipboard</button></div>
  <textarea id="brief" rows="16" style="margin-top:10px"></textarea></div>

  <div class="panel"><h2>Full Backup</h2>
  <div class="flex"><button class="btn ghost" onclick="backup()">Download full JSON backup</button></div></div>`;
}
async function runImport(){
  let d; const out=document.getElementById("impres");
  try{d=JSON.parse(document.getElementById("imp").value);}catch(e){out.innerHTML='<span class="neg">Invalid JSON: '+esc(e.message)+'</span>';return;}
  const log=[];
  try{
    if(d.predictions?.length){await api("predictions",{method:"POST",body:d.predictions});log.push(d.predictions.length+" predictions added");}
    if(d.settle?.length){for(const s of d.settle){const{entry_no,...rest}=s; if(rest.closing_odds&&!rest.market_prob)rest.market_prob=+(100/rest.closing_odds).toFixed(1); rest.stage="settled"; await api("predictions?entry_no=eq."+entry_no,{method:"PATCH",body:rest});} log.push(d.settle.length+" entries settled");}
    if(d.players?.length){await api("players?on_conflict=name,team",{method:"POST",headers:{Prefer:"resolution=merge-duplicates"},body:d.players});log.push(d.players.length+" players upserted");}
    if(d.coaches?.length){await api("coaches?on_conflict=name,team",{method:"POST",headers:{Prefer:"resolution=merge-duplicates"},body:d.coaches});log.push(d.coaches.length+" coaches upserted");}
    if(d.venues?.length){await api("venues?on_conflict=stadium",{method:"POST",headers:{Prefer:"resolution=merge-duplicates"},body:d.venues});log.push(d.venues.length+" venues upserted");}
    if(d.news?.length){for(const n of d.news){const{match,...rest}=n; const p=DB.predictions.find(x=>x.match===match); if(p)rest.prediction_id=p.id; await api("news_items",{method:"POST",body:rest});} log.push(d.news.length+" news items added");}
    if(d.teams?.length){await api("teams?on_conflict=name",{method:"POST",headers:{Prefer:"resolution=merge-duplicates"},body:d.teams});log.push(d.teams.length+" teams upserted");}
    out.innerHTML='<span class="pos">✓ '+log.join(" · ")+'</span>'; toast("Import complete"); loadAll();
  }catch(e){out.innerHTML='<span class="neg">Import failed: '+esc(e.message)+'</span>';}
}
function briefing(){
  const t=tierStats(),bs=betStats();
  const pct=(h,tt)=>tt?Math.round(h/tt*100)+"%":"n/a";
  const open=DB.predictions.filter(p=>!p.outcome);
  const notable=DB.players.filter(p=>p.prs>=8||p.status!=="fit"||p.hot_streak);
  const lines=[
    "# FOOTBALL PREDICTION SYSTEM — SESSION BRIEFING",
    "Generated "+new Date().toISOString().slice(0,10)+" from the Hub. This is the current system state; use it as full context.",
    "",
    "## Premier League state",
    (()=>{const s=DB.plstate; if(!s)return "- no PL data synced";
      if(s.season_over)return `- Season ${s.season} COMPLETE (38/38). New season fixtures pending FPL reset.`;
      if(seasonNotStarted(s))return `- Season ${s.season} NOT STARTED. First kickoff: ${s.first_kickoff||"TBD"}.`;
      return `- Season ${s.season}, Matchweek ${s.current_gw} of 38. Table and form live in the Hub.`})(),
    "",
    "## Record",
    `- 5-6★: ${t.five.h}/${t.five.t} (${pct(t.five.h,t.five.t)}) · 4★: ${t.four.h}/${t.four.t} (${pct(t.four.h,t.four.t)}) · AVOID correct: ${t.avoid.h}/${t.avoid.t} · game-script bets: ${bs.h}/${bs.t}`,
    "",
    "## Open calls",
    ...(open.length?open.map(p=>`- [#${p.entry_no}] ${p.match} (${p.match_date||"TBD"})${p.pick?` — pick ${p.pick} ${p.final_prob}% ${"★".repeat(p.stars||0)}`:" — no call yet"}${p.lineup_watch?` — 👁 LINEUP WATCH: ${p.lineup_watch_note||"PRS 8+ doubt"}`:""}`):["- none"]),
    "",
    "## PRS notables (8+, non-fit, or streaking)",
    ...(notable.length?notable.map(p=>`- ${p.name} (${p.team}, ${p.position||"?"}) PRS ${p.prs}${p.hot_streak?" 🔥HOT-STREAK→11":""} — ${p.status}${p.penalty_taker?", pen taker":""}${p.notes?" — "+p.notes:""}`):["- none"]),
    "",
    "## Hard rules",
    ...(DB.settings.hard_rules||[]).map(r=>"- "+r),
    "",
    "## Pipeline",
    "Base → PRS (±15 cap) → AIS (alt gap m ÷1000 ×0.5 goals; 1 goal ≈ 10-12%) → TMS (±6 cap) → context = final. 65%+ = 5★ bet · 50-65% = 4★ · coin-flip = 3★ goals only · below/PRS-doubt = AVOID.",
    "",
    "## How to send updates back to the Hub",
    "End the session by outputting an import block (JSON) in exactly this shape; I will paste it into the Hub:",
    "```json",
    JSON.stringify(IMPORT_SPEC,null,1),
    "```"
  ];
  document.getElementById("brief").value=lines.join("\n");
}
function copyBrief(){const b=document.getElementById("brief");if(!b.value)briefing();b.select();navigator.clipboard.writeText(b.value).then(()=>toast("Briefing copied"));}
function backup(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="prediction-hub-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();
}

/* ---------- INIT ---------- */
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
window.addEventListener("hashchange",()=>{TAB=location.hash.replace("#","")||"dashboard";render();});
loadAll().then(()=>{if(TAB==="calculator")calc(); syncPL(true);}).catch(e=>{document.getElementById("main").innerHTML='<div class="panel"><h2>Connection error</h2><p class="muted">'+esc(e.message)+'</p></div>';});
setInterval(()=>syncPL(true), 5*60*1000); // refresh PL data every 5 min while the Hub is open
const _origRender=render; render=function(){_origRender(); if(TAB==="calculator")setTimeout(calc,0);};
</script>
